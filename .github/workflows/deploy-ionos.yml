name: Deploy website to IONOS

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - robots.txt
      - sitemap.xml
      - proposte/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Run only after the restricted IONOS account and GitHub variables/secrets
    # have been configured and deployment has been explicitly enabled.
    if: vars.IONOS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment settings
        shell: bash
        env:
          IONOS_HOST: ${{ vars.IONOS_HOST }}
          IONOS_USER: ${{ vars.IONOS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          : "${IONOS_HOST:?Set the IONOS_HOST Actions variable}"
          : "${IONOS_USER:?Set the IONOS_DEPLOY_USER Actions variable}"
          test -s index.html
          test -s styles.css
          test -s robots.txt
          test -s sitemap.xml
          test -s proposte/index.html
          test ! -e proposte/app.js
          for page in \
            proposte/caseificio-luigi-parlato/index.html \
            proposte/osteria-al-buco/index.html \
            proposte/bb-stella/index.html; do
            test -s "$page"
            grep -q 'name="robots" content="noindex,nofollow,noarchive"' "$page"
          done
          test "$(find proposte/caseificio-luigi-parlato proposte/osteria-al-buco proposte/bb-stella -type f -name index.html | wc -l)" -eq 12
          for page in \
            $(find proposte/caseificio-luigi-parlato proposte/osteria-al-buco proposte/bb-stella -type f -name '*.html' | LC_ALL=C sort); do
            if grep -Eq '<a[^>]+href="/proposte/' "$page"; then
              echo "A concept page links to the private proposal directory: $page" >&2
              exit 1
            fi
          done

      - name: Prepare SSH with pinned host key
        shell: bash
        env:
          IONOS_PRIVATE_KEY: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}
          IONOS_KNOWN_HOSTS: ${{ secrets.IONOS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${IONOS_PRIVATE_KEY:?Set the IONOS_SSH_PRIVATE_KEY Actions secret}"
          : "${IONOS_KNOWN_HOSTS:?Set the verified IONOS_KNOWN_HOSTS Actions secret}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$IONOS_PRIVATE_KEY" > "$HOME/.ssh/ionos_deploy_key"
          printf '%s\n' "$IONOS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ionos_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Copy the website files into the restricted SFTP jail
        shell: bash
        env:
          IONOS_HOST: ${{ vars.IONOS_HOST }}
          IONOS_USER: ${{ vars.IONOS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          sftp -b - \
            -i "$HOME/.ssh/ionos_deploy_key" \
            -oBatchMode=yes \
            -oIdentitiesOnly=yes \
            -oStrictHostKeyChecking=yes \
            -oConnectTimeout=15 \
            "$IONOS_USER@$IONOS_HOST" <<EOF
          put styles.css /styles.css
          put index.html /index.html
          put robots.txt /robots.txt
          put sitemap.xml /sitemap.xml
          EOF

      - name: Copy proposal previews into the restricted SFTP jail
        shell: bash
        env:
          IONOS_HOST: ${{ vars.IONOS_HOST }}
          IONOS_USER: ${{ vars.IONOS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          batch_file="$RUNNER_TEMP/proposte.sftp"
          : > "$batch_file"
          printf -- '-rm /proposte/app.js\n' >> "$batch_file"
          for old_proposal in \
            casale-del-golfo \
            caseificio-carbone \
            caseificio-starace \
            cerase-vico-equense \
            frate-cosimo \
            ristorante-mustafa \
            ristorante-sant-angelo-monte-faito; do
            printf -- '-rm /proposte/%s/index.html\n' "$old_proposal" >> "$batch_file"
            printf -- '-rmdir /proposte/%s\n' "$old_proposal" >> "$batch_file"
          done
          while IFS= read -r directory; do
            printf -- '-mkdir /%s\n' "$directory" >> "$batch_file"
          done < <(
            {
              printf '%s\n' proposte proposte/assets proposte/assets/ufficiali
              find proposte/caseificio-luigi-parlato proposte/osteria-al-buco proposte/bb-stella -type d -print
            } | LC_ALL=C sort -u
          )
          while IFS= read -r file; do
            printf 'put %s /%s\n' "$file" "$file" >> "$batch_file"
          done < <(
            {
              printf '%s\n' \
                proposte/index.html \
                proposte/assets/ufficiali/parlato-provolone.jpg \
                proposte/assets/ufficiali/buco-pizza.optimized.jpg \
                proposte/assets/ufficiali/buco-storia.optimized.jpg \
                proposte/assets/ufficiali/buco-tavola.optimized.jpg \
                proposte/assets/ufficiali/bb-stella-camera-ampia.jpg \
                proposte/assets/ufficiali/bb-stella-standard-2.jpg \
                proposte/assets/ufficiali/vico-equense-panorama.jpg
              find proposte/caseificio-luigi-parlato proposte/osteria-al-buco proposte/bb-stella -type f -print
            } | LC_ALL=C sort -u
          )
          sftp -b "$batch_file" \
            -i "$HOME/.ssh/ionos_deploy_key" \
            -oBatchMode=yes \
            -oIdentitiesOnly=yes \
            -oStrictHostKeyChecking=yes \
            -oConnectTimeout=15 \
            "$IONOS_USER@$IONOS_HOST"

      - name: Verify the public homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --compressed \
            https://diegodesposito.it/ \
            --output "$RUNNER_TEMP/deployed-index.html"
          cmp --silent index.html "$RUNNER_TEMP/deployed-index.html"
          curl --fail --silent --show-error --location --compressed \
            https://diegodesposito.it/robots.txt \
            --output "$RUNNER_TEMP/deployed-robots.txt"
          cmp --silent robots.txt "$RUNNER_TEMP/deployed-robots.txt"
          curl --fail --silent --show-error --location --compressed \
            https://diegodesposito.it/sitemap.xml \
            --output "$RUNNER_TEMP/deployed-sitemap.xml"
          cmp --silent sitemap.xml "$RUNNER_TEMP/deployed-sitemap.xml"
          curl --fail --silent --show-error --location --compressed \
            https://diegodesposito.it/proposte/ \
            --output "$RUNNER_TEMP/deployed-proposte-index.html"
          cmp --silent proposte/index.html "$RUNNER_TEMP/deployed-proposte-index.html"
          app_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            https://diegodesposito.it/proposte/app.js)
          test "$app_status" = "404"
          for asset in \
            proposte/assets/ufficiali/parlato-provolone.jpg \
            proposte/assets/ufficiali/buco-pizza.optimized.jpg \
            proposte/assets/ufficiali/buco-storia.optimized.jpg \
            proposte/assets/ufficiali/buco-tavola.optimized.jpg \
            proposte/assets/ufficiali/bb-stella-camera-ampia.jpg \
            proposte/assets/ufficiali/bb-stella-standard-2.jpg \
            proposte/assets/ufficiali/vico-equense-panorama.jpg; do
            curl --fail --silent --show-error --location --compressed \
              "https://diegodesposito.it/$asset" \
              --output "$RUNNER_TEMP/deployed-photo"
            cmp --silent "$asset" "$RUNNER_TEMP/deployed-photo"
          done
          while IFS= read -r file; do
            route="/$(dirname "$file")/"
            curl --fail --silent --show-error --location --compressed \
              "https://diegodesposito.it$route" \
              --output "$RUNNER_TEMP/deployed-preview.html"
            cmp --silent "$file" "$RUNNER_TEMP/deployed-preview.html"
          done < <(find proposte/caseificio-luigi-parlato proposte/osteria-al-buco proposte/bb-stella -type f -name index.html | LC_ALL=C sort)
          for old_proposal in \
            casale-del-golfo \
            caseificio-carbone \
            caseificio-starace \
            cerase-vico-equense \
            frate-cosimo \
            ristorante-mustafa \
            ristorante-sant-angelo-monte-faito; do
            old_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://diegodesposito.it/proposte/$old_proposal/index.html")
            test "$old_status" = "404"
          done
